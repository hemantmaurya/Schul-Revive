version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: schulnetz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: weAdmin
      POSTGRES_PASSWORD: pass123word
      POSTGRES_DB: schulnetz
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weAdmin -d schulnetz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: schulnetz-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://weAdmin:pass123word@db:5432/schulnetz
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: schulnetz-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:4000
    command: npm run dev
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: schulnetz-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@schulnetz.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  db-data:
  pgadmin-data: